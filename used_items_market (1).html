<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق البحرين للأشياء المستعملة</title>
    <style>
        body { font-family: Arial, sans-serif; direction: rtl; text-align: center; }
        header { background: #007bff; color: white; padding: 15px; font-size: 24px; }
        .container { width: 80%; margin: auto; }
        .product { border: 1px solid #ddd; padding: 15px; margin: 15px; display: inline-block; width: 30%; }
        button { padding: 10px; margin-top: 10px; background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>سوق البحرين للأشياء المستعملة</header>
    <div class="container">
        <h2>بيع وشراء المنتجات المستعملة بسهولة!</h2>
        <div class="product">
            <h3>كنبة مستعملة بحالة جيدة</h3>
            <p>السعر: 50 دينار</p>
            <button>تواصل مع البائع</button>
        </div>
        <div class="product">
            <h3>هاتف iPhone 12 مستعمل</h3>
            <p>السعر: 200 دينار</p>
            <button>تواصل مع البائع</button>
        </div>
    </div>
</body>
</html>
